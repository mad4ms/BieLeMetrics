[project]
name = "bielemetrics"
version = "0.1.0"
description = "A Python library for processing positional and event Handball data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Adams", email = "m@ad4ms.de" }]

keywords = ["handball", "ml", "sportradar", "kinexon", "data", "wrapper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pyarrow",
    "pandas",
    "numpy",
    "matplotlib",
    "ttkbootstrap>=1.14.2",
    "scikit-learn",
    "shapely",
    "tqdm",
    "python-dotenv",
    "kinexon-handball-api",
    "sportradar-datacore-api>=0.1.3",
    "duckdb>=1.4.1",
    "plotly>=6.4.0",
    "opencv-python>=4.11.0.86",
    "dagster>=1.12.2",
    "dagster-webserver>=1.12.2",
    "dagster-duckdb>=0.28.2",
    "thefuzz>=0.22.1",
    "seaborn>=0.13.2",
    "xgboost-cpu>=3.2.0",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-order>=1.3",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=3.0.0.260204",
    "types-tqdm>=4.67.3.20260205",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# [tool.uv.sources]
# kinexon-handball-api = { path = "../KinexonHandballAPI" }
# sportradar-datacore-api = { path = "../SportradarDatacoreAPI" }


[tool.pylint.'MESSAGES CONTROL']
disable = ["relative-beyond-top-level", "E402"]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-overload", "operator", "return"]

[[tool.mypy.overrides]]
module = [
    "fetcher_kinexon.*",
    "fetcher_sportradar.*",
    "hbl_etl_dagster.*",
    "kinexon_handball_api.*",
    "sportradar_datacore_api.*",
    "sklearn.*",
    "cv2",
    "joblib",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "nbconvert>=7.17.0",
]
